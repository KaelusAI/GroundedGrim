webhook-test-message: "test mesajı"
webhook-test-succeeded: "Discord webhook testi başarılı!"
webhook-test-failed: "Discord webhook testi başarısız!"

# Geçerli yer tutucular:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - ihlal sayısı
# %verbose% - kontrolden elde edilen ek bilgi, tüm kontroller bilgi eklemez
alerts-format: "%prefix% &f%player% &b%check_name%%experimental% &fkontrolünde başarısız oldu &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &b%check_name%%experimental% &fkontrolünde başarısız oldu &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &f%player% &biçin profil"
    - "&bGecikme: &f%ping%"
    - "&bSürüm: &f%version%"
    - "&bİstemci markası: &f%brand%"
    - "&bYatay hassasiyet: &f%h_sensitivity%%"
    - "&bDikey hassasiyet: &f%v_sensitivity%%"
    - "&bFastMath etkin: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/grim alerts [player] &f- &7Uyarıları aç/kapat (isteğe bağlı oyuncuya göre filtrele)"
    - "/grim brands &f- &7Markaları aç/kapat"
    - "/grim profile <player> &f- &7Oyuncu bilgilerini görüntüle"
    - "/grim help &f- &7Bu yardım mesajını görüntüle"
    - "/grim debug start/stop <player> &f- &7Tahmin hata ayıklamayı başlat/durdur"
    - "/grim debug filter add/remove/reset &f- &7Hata ayıklama filtrelerini yönet"
    - "/grim debug paste <player> &f- &7Hata ayıklama tamponunu yükle"
    - "/grim perf &f- &7Geliştirici ms/tahmin"
    - "/grim reload &f- &7Yapılandırmayı yeniden yükle"
    - "/grim spectate <player> &f- &7Bir oyuncuyu izle"
    - "/grim verbose [player] &f- &7Tüm bayrakları göster (isteğe bağlı oyuncuya göre filtrele)"
    - "/grim log <id> &f- &7Bir bayrağın hata ayıklama logunu yükle"
    - "/grim log last [count] &f- &7Son N bayrağı yükle"
    - "/grim log range <from>-<to> &f- &7Bir aralıktaki bayrakları yükle"
    - "/grim logger &f- &7Paket günlükçüsü (alt komutlar için /grim logger yazın)"
    - "/grim history <player> [page] &f- &7Oyuncunun önceki uyarılarını göster"
    - "&7======================"

grim-history-load-failure: "%prefix% &cGeçmiş alt sistemi yüklenemedi! Hatalar için sunucu konsolunu kontrol edin."
grim-history-disabled: "%prefix% &cGeçmiş alt sistemi devre dışı!"
# Geçerli yer tutucular: %prefix% %player% %page% %maxPages%
grim-history-header: "%prefix% &bKayıtlar gösteriliyor: &f%player% (&f%page%&b/&f%maxPages%&f)"
# Geçerli yer tutucular: %prefix% %grim_version% %client_brand% %client_version% %server_version% %check% %vl% %verbose% %timeago% %server%
grim-history-entry: "%prefix% &8[&f%server%&8] &bBaşarısız &f%check% (x&c%vl%&f) &7%verbose% (&b%timeago% önce&7)"
