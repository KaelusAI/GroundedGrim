# \u00BB это » (двойной >>), ANSI и UTF-8 интерпретируют это по-разному... вы можете даже увидеть "?" из-за этого
prefix: "&bGroundedGrim &8\u00BB"

alerts-enabled: "%prefix% &fОповещения включены"
alerts-disabled: "%prefix% &fОповещения отключены"
verbose-enabled: "%prefix% &fПодробный режим включён"
verbose-disabled: "%prefix% &fПодробный режим отключён"
alerts-filter: "%prefix% &fФильтр оповещений: &b%player%"
verbose-filter: "%prefix% &fФильтр подробностей: &b%player%"
brands-enabled: "%prefix% &fОтображение брендов включено"
brands-disabled: "%prefix% &fОтображение брендов отключено"
client-brand-format: "%prefix% &f%player% присоединился, используя %brand%"
console-specify-target: "%prefix% &cВы должны указать цель в качестве консоли!"
reloading: "%prefix% &7Перезагрузка конфига..."
reloaded: "%prefix% &fКонфиг перезагружен."
reload-failed: "%prefix% &cНе удалось перезагрузить конфиг."
player-not-found: "%prefix% &cИгрок исключён или не в сети!"
player-not-this-server: "%prefix% &cИгрок не на этом сервере!"
sender-not-found: "%prefix% &cВы не можете использовать эту команду с исключением!"
spectate-return: "<click:run_command:/grim stopspectating><hover:show_text:\"/grim stopspectating\">\n%prefix% &fНажмите, чтобы вернуться на прежнее место\n</hover></click>"
cannot-spectate-return: "%prefix% &cЭто доступно только после наблюдения за игроком"
cannot-run-on-self: "%prefix% &cВы не можете использовать эту команду на себе!"
upload-log: "%prefix% &fЛог загружен: %url%"
upload-log-start: "%prefix% &fЗагрузка лога... подождите"
upload-log-not-found: "%prefix% &cЛог не найден"
upload-log-upload-failure: "%prefix% &cОшибка загрузки лога, подробности в консоли"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>Ошибка обработки пакетов. Свяжитесь с администрацией."
    blacklisted-forge: "<red>Ваша версия Forge заблокирована из-за встроенного увеличения дальности атаки.<newline><gold>Затронутые версии: 1.18.2-1.19.3<newline><newline><red>Подробнее: https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &cЭта команда доступна только игрокам!"
run-as-player-or-console: "%prefix% &cЭта команда доступна только игрокам или консоли!"
webhook-not-enabled: "Discord вебхуки не включены!"
webhook-test-message: "тестовое сообщение"
webhook-test-succeeded: "Тест Discord вебхука успешен!"
webhook-test-failed: "Тест Discord вебхука не удался!"

# Допустимые заполнители:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - нарушения
# %verbose% - дополнительная информация от проверки, например, смещения, не все проверки добавляют информацию.
alerts-format: "%prefix% &f%player% &bпровалил &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &bпровалил &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &bПрофиль &f%player%"
    - "&bПинг: &f%ping%"
    - "&bВерсия: &f%version%"
    - "&bБренд клиента: &f%brand%"
    - "&bГоризонтальная чувствительность: &f%h_sensitivity%%"
    - "&bВертикальная чувствительность: &f%v_sensitivity%%"
    - "&bFastMath: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/grim alerts [player] &f- &7Оповещения (фильтр по игроку)"
    - "/grim brands &f- &7Отображение брендов"
    - "/grim profile <player> &f- &7Информация об игроке"
    - "/grim help &f- &7Справка"
    - "/grim debug start/stop <player> &f- &7Отладка предсказаний"
    - "/grim debug filter add/remove/reset &f- &7Фильтры отладки"
    - "/grim debug paste <player> &f- &7Загрузить буфер отладки"
    - "/grim perf &f- &7Производительность (мс/предсказание)"
    - "/grim reload &f- &7Перезагрузить конфиг"
    - "/grim spectate <player> &f- &7Наблюдение за игроком"
    - "/grim verbose [player] &f- &7Все флаги (фильтр по игроку)"
    - "/grim log <id> &f- &7Загрузить лог флага"
    - "/grim log last [count] &f- &7Загрузить последние N флагов"
    - "/grim log range <from>-<to> &f- &7Загрузить диапазон флагов"
    - "/grim logger &f- &7Логгер пакетов (подкоманды: /grim logger)"
    - "/grim history <player> [page] &f- &7История оповещений игрока"
    - "&7======================"

grim-history-load-failure: "%prefix% &cНе удалось загрузить подсистему истории! Проверьте консоль."
grim-history-disabled: "%prefix% &cПодсистема истории отключена!"
# Допустимые заполнители: %prefix% %player% %page% %maxPages%
grim-history-header: "%prefix% &bЛоги &f%player% (&f%page%&b/&f%maxPages%&f)"
# Допустимые заполнители: %prefix% %grim_version% %client_brand% %client_version% %server_version% %check% %vl% %verbose% %timeago% %server%
grim-history-entry: "%prefix% &8[&f%server%&8] &bПровалено &f%check% (x&c%vl%&f) &7%verbose% (&b%timeago% назад&7)"
