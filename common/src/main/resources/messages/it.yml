# \u00BB è » (doppio >>), ANSI e UTF-8 lo interpretano in modo diverso... potresti anche vedere "?" a causa di ciò.
prefix: "&bGroundedGrim &8\u00BB"

alerts-enabled: "%prefix% &fAvvisi abilitati"
alerts-disabled: "%prefix% &fAvvisi disabilitati"
verbose-enabled: "%prefix% &fVerbose abilitato"
verbose-disabled: "%prefix% &fVerbose disabilitato"
alerts-filter: "%prefix% &fFiltro avvisi per: &b%player%"
verbose-filter: "%prefix% &fFiltro verbose per: &b%player%"
brands-enabled: "%prefix% &fMarche abilitate"
brands-disabled: "%prefix% &fMarche disabilitate"
client-brand-format: "%prefix% &f%player% si è connesso usando %brand%"
console-specify-target: "%prefix% &cDevi specificare un obiettivo dalla console!"
reloading: "%prefix% &7Ricaricamento configurazione..."
reloaded: "%prefix% &fLa configurazione è stata ricaricata."
reload-failed: "%prefix% &cErrore nel ricaricare la configurazione."
player-not-found: "%prefix% &cIl giocatore è esente o offline!"
player-not-this-server: "%prefix% &cIl giocatore non è su questo server!"
sender-not-found: "%prefix% &cNon puoi usare questo comando se sei esente!"
spectate-return: "<click:run_command:/grim stopspectating><hover:show_text:\"/grim stopspectating\">\n%prefix% &fClicca qui per tornare alla posizione precedente\n</hover></click>"
cannot-spectate-return: "%prefix% &cPuoi farlo solo dopo aver osservato un giocatore"
cannot-run-on-self: "%prefix% &cNon puoi usare questo comando su te stesso!"
upload-log: "%prefix% &fDebug caricato su: %url%"
upload-log-start: "%prefix% &fCaricamento del log... attendere prego"
upload-log-not-found: "%prefix% &cImpossibile trovare quel log"
upload-log-upload-failure: "%prefix% &cQualcosa è andato storto durante il caricamento di questo log, vedi la console per ulteriori informazioni"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>Si è verificato un errore durante l'elaborazione dei pacchetti. Contatta gli amministratori."
    blacklisted-forge: "<red>La tua versione di Forge è bloccata a causa di hack di portata integrati.<newline><gold>Versioni interessate: 1.18.2-1.19.3<newline><newline><red>Consulta https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &cQuesto comando può essere utilizzato solo dai giocatori!"
run-as-player-or-console: "%prefix% &cQuesto comando può essere utilizzato solo dai giocatori o dalla console!"
webhook-not-enabled: "I webhook di Discord non sono abilitati!"
webhook-test-message: "messaggio di prova"
webhook-test-succeeded: "Test del webhook di Discord riuscito!"
webhook-test-failed: "Test del webhook di Discord fallito!"

# Segnaposto validi:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - violazioni
# %verbose% - informazioni extra dal controllo, non tutti i controlli aggiungono informazioni
alerts-format: "%prefix% &f%player% &bha fallito &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &bha fallito &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &bProfilo di &f%player%"
    - "&bPing: &f%ping%"
    - "&bVersione: &f%version%"
    - "&bMarca del client: &f%brand%"
    - "&bSensibilità orizzontale: &f%h_sensitivity%%"
    - "&bSensibilità verticale: &f%v_sensitivity%%"
    - "&bFastMath abilitato: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/grim alerts [player] &f- &7Attiva/disattiva avvisi (filtro opzionale per giocatore)"
    - "/grim brands &f- &7Attiva/disattiva marche"
    - "/grim profile <player> &f- &7Visualizza info giocatore"
    - "/grim help &f- &7Mostra questo messaggio di aiuto"
    - "/grim debug start/stop <player> &f- &7Avvia/ferma debug predizione"
    - "/grim debug filter add/remove/reset &f- &7Gestisci filtri debug"
    - "/grim debug paste <player> &f- &7Carica buffer debug"
    - "/grim perf &f- &7Sviluppatore ms/predizione"
    - "/grim reload &f- &7Ricarica la configurazione"
    - "/grim spectate <player> &f- &7Osserva un giocatore"
    - "/grim verbose [player] &f- &7Mostra ogni flag (filtro opzionale per giocatore)"
    - "/grim log <id> &f- &7Carica log debug di un flag"
    - "/grim log last [count] &f- &7Carica gli ultimi N flag"
    - "/grim log range <from>-<to> &f- &7Carica un intervallo di flag"
    - "/grim logger &f- &7Logger pacchetti (vedi /grim logger per i sottocomandi)"
    - "/grim history <player> [page] &f- &7Mostra avvisi precedenti del giocatore"
    - "&7======================"

grim-history-load-failure: "%prefix% &cImpossibile caricare il sottosistema della cronologia! Controlla la console del server per errori."
grim-history-disabled: "%prefix% &cIl sottosistema cronologia è disabilitato!"
# Segnaposto validi: %prefix% %player% %page% %maxPages%
grim-history-header: "%prefix% &bMostro i log per &f%player% (&f%page%&b/&f%maxPages%&f)"
# Segnaposto validi: %prefix% %grim_version% %client_brand% %client_version% %server_version% %check% %vl% %verbose% %timeago% %server%
grim-history-entry: "%prefix% &8[&f%server%&8] &bFallito &f%check% (x&c%vl%&f) &7%verbose% (&b%timeago% fa&7)"
