# \u00BB is » (dubbel >>), ANSI en UTF-8 interpreteren dit anders... je kunt zelfs "?" zien als gevolg hiervan.
prefix: "&bGroundedGrim &8\u00BB"

alerts-enabled: "%prefix% &fMeldingen ingeschakeld"
alerts-disabled: "%prefix% &fMeldingen uitgeschakeld"
verbose-enabled: "%prefix% &fVerbose ingeschakeld"
verbose-disabled: "%prefix% &fVerbose uitgeschakeld"
alerts-filter: "%prefix% &fMeldingen gefilterd voor: &b%player%"
verbose-filter: "%prefix% &fVerbose gefilterd voor: &b%player%"
brands-enabled: "%prefix% &fMerken ingeschakeld"
brands-disabled: "%prefix% &fMerken uitgeschakeld"
client-brand-format: "%prefix% &f%player% is verbonden met %brand%"
console-specify-target: "%prefix% &cJe moet een doel opgeven vanuit de console!"
reloading: "%prefix% &7Configuratie wordt herladen..."
reloaded: "%prefix% &fDe configuratie is herladen."
reload-failed: "%prefix% &cHerladen van configuratie mislukt."
player-not-found: "%prefix% &cSpeler is vrijgesteld of offline!"
player-not-this-server: "%prefix% &cSpeler is niet op deze server!"
sender-not-found: "%prefix% &cJe kunt dit commando niet gebruiken als je vrijgesteld bent!"
spectate-return: "<click:run_command:/grim stopspectating><hover:show_text:\"/grim stopspectating\">\n%prefix% &fKlik hier om terug te keren naar de vorige locatie\n</hover></click>"
cannot-spectate-return: "%prefix% &cJe kunt dit alleen doen nadat je een speler hebt geobserveerd"
cannot-run-on-self: "%prefix% &cJe kunt dit commando niet op jezelf gebruiken!"
upload-log: "%prefix% &fDebug geüpload naar: %url%"
upload-log-start: "%prefix% &fLog wordt geüpload... even geduld"
upload-log-not-found: "%prefix% &cKan dat log niet vinden"
upload-log-upload-failure: "%prefix% &cEr is iets misgegaan tijdens het uploaden van dit log, zie console voor meer informatie"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>Er is een fout opgetreden bij het verwerken van pakketten. Neem contact op met de beheerders."
    blacklisted-forge: "<red>Je Forge-versie is geblokkeerd vanwege ingebouwde reach-hacks.<newline><gold>Getroffen versies: 1.18.2-1.19.3<newline><newline><red>Zie https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &cDit commando kan alleen door spelers worden gebruikt!"
run-as-player-or-console: "%prefix% &cDit commando kan alleen door spelers of de console worden gebruikt!"
webhook-not-enabled: "Discord-webhooks zijn niet ingeschakeld!"
webhook-test-message: "testbericht"
webhook-test-succeeded: "Discord-webhooktest geslaagd!"
webhook-test-failed: "Discord-webhooktest mislukt!"

# Geldige plaatsaanduidingen:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - overtredingen
# %verbose% - extra informatie van de controle, niet alle controles voegen informatie toe
alerts-format: "%prefix% &f%player% &bmislukt &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &bmislukt &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &bProfiel voor &f%player%"
    - "&bPing: &f%ping%"
    - "&bVersie: &f%version%"
    - "&bClient-merk: &f%brand%"
    - "&bHorizontale gevoeligheid: &f%h_sensitivity%%"
    - "&bVerticale gevoeligheid: &f%v_sensitivity%%"
    - "&bFastMath ingeschakeld: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/grim alerts [player] &f- &7Meldingen aan/uit (optioneel filteren op speler)"
    - "/grim brands &f- &7Merken aan/uit"
    - "/grim profile <player> &f- &7Spelerinformatie bekijken"
    - "/grim help &f- &7Dit helpbericht tonen"
    - "/grim debug start/stop <player> &f- &7Voorspellingsdebug starten/stoppen"
    - "/grim debug filter add/remove/reset &f- &7Debugfilters beheren"
    - "/grim debug paste <player> &f- &7Debugbuffer uploaden"
    - "/grim perf &f- &7Ontwikkelaar ms/voorspelling"
    - "/grim reload &f- &7Configuratie herladen"
    - "/grim spectate <player> &f- &7Een speler observeren"
    - "/grim verbose [player] &f- &7Alle flags tonen (optioneel filteren op speler)"
    - "/grim log <id> &f- &7Debuglog van een flag uploaden"
    - "/grim log last [count] &f- &7Laatste N flags uploaden"
    - "/grim log range <from>-<to> &f- &7Een bereik van flags uploaden"
    - "/grim logger &f- &7Pakketlogger (zie /grim logger voor subcommando's)"
    - "/grim history <player> [page] &f- &7Eerdere meldingen van de speler tonen"
    - "&7======================"

grim-history-load-failure: "%prefix% &cGeschiedenissubsysteem kon niet worden geladen! Controleer de serverconsole op fouten."
grim-history-disabled: "%prefix% &cHet geschiedenissubsysteem is uitgeschakeld!"
# Geldige plaatsaanduidingen: %prefix% %player% %page% %maxPages%
grim-history-header: "%prefix% &bLogs tonen voor &f%player% (&f%page%&b/&f%maxPages%&f)"
# Geldige plaatsaanduidingen: %prefix% %grim_version% %client_brand% %client_version% %server_version% %check% %vl% %verbose% %timeago% %server%
grim-history-entry: "%prefix% &8[&f%server%&8] &bMislukt &f%check% (x&c%vl%&f) &7%verbose% (&b%timeago% geleden&7)"
