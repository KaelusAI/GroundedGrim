# \u00BB se traduit par » (double >>). Les interprétations diffèrent entre ANSI et UTF-8... vous pouvez même voir ? à cause de cela.
prefix: "&bGroundedGrim &8\u00BB"

alerts-enabled: "%prefix% &fAlertes activées"
alerts-disabled: "%prefix% &fAlertes désactivées"
verbose-enabled: "%prefix% &fVerbose activé"
verbose-disabled: "%prefix% &fVerbose désactivé"
alerts-filter: "%prefix% &fFiltrage des alertes pour : &b%player%"
verbose-filter: "%prefix% &fFiltrage du verbose pour : &b%player%"
brands-enabled: "%prefix% &fMarques activées"
brands-disabled: "%prefix% &fMarques désactivées"
client-brand-format: "%prefix% &f%player% a rejoint en utilisant %brand%"
console-specify-target: "%prefix% &cVous devez spécifier une cible en tant que console !"
reloading: "%prefix% &7Rechargement de la configuration..."
reloaded: "%prefix% &fLa configuration a été rechargée."
reload-failed: "%prefix% &cÉchec du rechargement de la configuration."
player-not-found: "%prefix% &cLe joueur est exempté ou hors ligne !"
player-not-this-server: "%prefix% &cLe joueur n'est pas sur ce serveur !"
sender-not-found: "%prefix% &cVous ne pouvez pas utiliser cette commande si vous êtes exempté !"
spectate-return: "<click:run_command:/grim stopspectating><hover:show_text:\"/grim stopspectating\">\n%prefix% &fCliquez ici pour retourner à votre position précédente\n</hover></click>"
cannot-spectate-return: "%prefix% &cVous ne pouvez faire cela qu'après avoir observé un joueur"
cannot-run-on-self: "%prefix% &cVous ne pouvez pas utiliser cette commande sur vous-même !"
upload-log: "%prefix% &fDébogage téléversé vers : %url%"
upload-log-start: "%prefix% &fTéléversement du journal... Veuillez patienter"
upload-log-not-found: "%prefix% &cImpossible de trouver ce journal"
upload-log-upload-failure: "%prefix% &cUne erreur est survenue lors du téléversement de ce journal, consultez la console pour plus d'informations"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>Une erreur est survenue lors du traitement des paquets. Veuillez contacter les administrateurs."
    blacklisted-forge: "<red>Votre version de Forge est bloquée en raison de hacks de portée intégrés.<newline><gold>Versions concernées : 1.18.2-1.19.3<newline><newline><red>Veuillez consulter https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &cCette commande ne peut être utilisée que par les joueurs !"
run-as-player-or-console: "%prefix% &cCette commande ne peut être utilisée que par les joueurs ou la console !"
webhook-not-enabled: "Les webhooks Discord ne sont pas activés !"
webhook-test-message: "message de test"
webhook-test-succeeded: "Test du webhook Discord réussi !"
webhook-test-failed: "Test du webhook Discord échoué !"

# Placeholders valides :
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - violations
# %verbose% - informations supplémentaires de la vérification, toutes les vérifications n'ajoutent pas d'informations
alerts-format: "%prefix% &f%player% &ba échoué &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &ba échoué &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &bProfil de &f%player%"
    - "&bPing : &f%ping%"
    - "&bVersion : &f%version%"
    - "&bMarque du client : &f%brand%"
    - "&bSensibilité horizontale : &f%h_sensitivity%%"
    - "&bSensibilité verticale : &f%v_sensitivity%%"
    - "&bFastMath activé : &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/grim alerts [player] &f- &7Activer/désactiver les alertes (filtrer par joueur en option)"
    - "/grim brands &f- &7Activer/désactiver les marques"
    - "/grim profile <player> &f- &7Voir les infos du joueur"
    - "/grim help &f- &7Afficher ce message d'aide"
    - "/grim debug start/stop <player> &f- &7Démarrer/arrêter le débogage de prédiction"
    - "/grim debug filter add/remove/reset &f- &7Gérer les filtres de débogage"
    - "/grim debug paste <player> &f- &7Téléverser le buffer de débogage"
    - "/grim perf &f- &7Développeur ms/prédiction"
    - "/grim reload &f- &7Recharger la configuration"
    - "/grim spectate <player> &f- &7Observer un joueur"
    - "/grim verbose [player] &f- &7Afficher chaque flag (filtrer par joueur en option)"
    - "/grim log <id> &f- &7Téléverser le log de débogage d'un flag"
    - "/grim log last [count] &f- &7Téléverser les N derniers flags"
    - "/grim log range <from>-<to> &f- &7Téléverser une plage de flags"
    - "/grim logger &f- &7Logger de paquets (voir /grim logger pour les sous-commandes)"
    - "/grim history <player> [page] &f- &7Afficher les alertes précédentes du joueur"
    - "&7======================"

grim-history-load-failure: "%prefix% &cLe sous-système d'historique n'a pas pu être chargé ! Vérifiez la console du serveur pour les erreurs."
grim-history-disabled: "%prefix% &cLe sous-système d'historique est désactivé !"
# Placeholders valides : %prefix% %player% %page% %maxPages%
grim-history-header: "%prefix% &bAffichage des journaux pour &f%player% (&f%page%&b/&f%maxPages%&f)"
# Placeholders valides : %prefix% %grim_version% %client_brand% %client_version% %server_version% %check% %vl% %verbose% %timeago% %server%
grim-history-entry: "%prefix% &8[&f%server%&8] &bÉchoué &f%check% (x&c%vl%&f) &7%verbose% (&bil y a %timeago%&7)"
