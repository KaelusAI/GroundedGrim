# \u00BB 表示 » (相当于缩小版的 >>), ANSI和UTF-8的显示方式有所不同, 有时你甚至可以看到乱码.
prefix: "&bGroundedGrim &8\u00BB"

alerts-enabled: "%prefix% &f警报已开启"
alerts-disabled: "%prefix% &f警报已禁用"
verbose-enabled: "%prefix% &f详细警报已开启"
verbose-disabled: "%prefix% &f详细警报已禁用"
alerts-filter: "%prefix% &f正在过滤警报: &b%player%"
verbose-filter: "%prefix% &f正在过滤详细信息: &b%player%"
brands-enabled: "%prefix% &f客户端品牌显示已开启"
brands-disabled: "%prefix% &f客户端品牌显示已禁用"
client-brand-format: "%prefix% &f%player% 使用 %brand% 加入了游戏"
console-specify-target: "%prefix% &c作为控制台, 您必须指定一个目标!"
reloading: "%prefix% &7正在重载配置..."
reloaded: "%prefix% &f配置已重载完毕。"
reload-failed: "%prefix% &c重载配置失败。"
player-not-found: "%prefix% &c该玩家已被豁免或不在线!"
player-not-this-server: "%prefix% &c该玩家不在此服务器上!"
sender-not-found: "%prefix% &c如果你被豁免, 则无法使用此命令!"
spectate-return: "<click:run_command:/grim stopspectating><hover:show_text:\"/grim stopspectating\">\n%prefix% &f点击这里返回之前的位置\n</hover></click>"
cannot-spectate-return: "%prefix% &c只有在观察玩家之后才能执行此操作"
cannot-run-on-self: "%prefix% &c你不能对自己使用此命令!"
upload-log: "%prefix% &f已将调试日志上传至: %url%"
upload-log-start: "%prefix% &f正在上传日志...请稍候"
upload-log-not-found: "%prefix% &c找不到该日志"
upload-log-upload-failure: "%prefix% &c上传此日志时出错, 详细信息请查看控制台"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>处理数据包时发生错误。请联系管理员。"
    blacklisted-forge: "<red>您的Forge版本因内置作弊功能已被列入黑名单。<newline><gold>受影响版本: 1.18.2-1.19.3<newline><newline><red>请参阅 https://github.com/MinecraftForge/MinecraftForge/issues/9309。"
run-as-player: "%prefix% &c此命令只能由玩家使用!"
run-as-player-or-console: "%prefix% &c此命令只能由玩家或控制台使用!"
webhook-not-enabled: "Discord Webhook未启用!"
webhook-test-message: "测试消息"
webhook-test-succeeded: "Discord Webhook测试成功!"
webhook-test-failed: "Discord Webhook测试失败!"

# 可用变量:
# %prefix% - 前缀
# %player% - 玩家
# %check_name% - 检测名称
# %description% - 检测描述
# %experimental% - 是否为实验性检测
# %vl% - 违规值
# %verbose% - 检测的额外信息, 并非所有检测都会附加信息
alerts-format: "%prefix% &f%player% &b触发了 &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &b触发了 &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &f%player% &b的信息"
    - "&b延迟: &f%ping%"
    - "&b版本: &f%version%"
    - "&b客户端品牌: &f%brand%"
    - "&b水平灵敏度: &f%h_sensitivity%%"
    - "&b垂直灵敏度: &f%v_sensitivity%%"
    - "&bFastMath: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/grim alerts [player] &f- &7开关警报 (可按玩家过滤)"
    - "/grim brands &f- &7开关客户端品牌显示"
    - "/grim profile <player> &f- &7查看玩家信息"
    - "/grim help &f- &7显示此帮助信息"
    - "/grim debug start/stop <player> &f- &7开始/停止预测调试"
    - "/grim debug filter add/remove/reset &f- &7管理调试过滤器"
    - "/grim debug paste <player> &f- &7上传调试缓冲区"
    - "/grim perf &f- &7开发者 ms/预测"
    - "/grim reload &f- &7重载配置"
    - "/grim spectate <player> &f- &7观察一个玩家"
    - "/grim verbose [player] &f- &7显示所有标记 (可按玩家过滤)"
    - "/grim log <id> &f- &7上传一个标记的调试日志"
    - "/grim log last [count] &f- &7上传最近N个标记"
    - "/grim log range <from>-<to> &f- &7上传一个范围内的标记"
    - "/grim logger &f- &7数据包记录器 (使用 /grim logger 查看子命令)"
    - "/grim history <player> [page] &f- &7显示该玩家的历史警报"
    - "&7======================"

grim-history-load-failure: "%prefix% &c历史子系统加载失败! 请检查服务器控制台中的错误。"
grim-history-disabled: "%prefix% &c历史子系统已禁用!"
# 可用变量: %prefix% %player% %page% %maxPages%
grim-history-header: "%prefix% &b显示 &f%player% 的日志 (&f%page%&b/&f%maxPages%&f)"
# 可用变量: %prefix% %grim_version% %client_brand% %client_version% %server_version% %check% %vl% %verbose% %timeago% %server%
grim-history-entry: "%prefix% &8[&f%server%&8] &b失败 &f%check% (x&c%vl%&f) &7%verbose% (&b%timeago% 前&7)"
