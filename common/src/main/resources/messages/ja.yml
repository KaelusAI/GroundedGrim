# \u00BB は » (二重 >>)です。ANSI と UTF-8 はこれを異なる方法で解釈します... 場合によっては ? と表示されることがあります。
prefix: "&bGroundedGrim &8\u00BB"

alerts-enabled: "%prefix% &fアラートが有効になりました"
alerts-disabled: "%prefix% &fアラートが無効になりました"
verbose-enabled: "%prefix% &fVerboseが有効になりました"
verbose-disabled: "%prefix% &fVerboseが無効になりました"
alerts-filter: "%prefix% &fアラートをフィルタ中: &b%player%"
verbose-filter: "%prefix% &fVerboseをフィルタ中: &b%player%"
brands-enabled: "%prefix% &fブランド表示が有効になりました"
brands-disabled: "%prefix% &fブランド表示が無効になりました"
client-brand-format: "%prefix% &f%player% が %brand% を使用して参加しました"
console-specify-target: "%prefix% &cコンソールからはターゲットを指定する必要があります！"
reloading: "%prefix% &7設定を再読み込み中..."
reloaded: "%prefix% &f設定が再読み込みされました。"
reload-failed: "%prefix% &c設定の再読み込みに失敗しました。"
player-not-found: "%prefix% &cプレイヤーは免除されているか、オフラインです！"
player-not-this-server: "%prefix% &cプレイヤーはこのサーバーにいません！"
sender-not-found: "%prefix% &c免除されている場合、このコマンドは使用できません！"
spectate-return: "<click:run_command:/grim stopspectating><hover:show_text:\"/grim stopspectating\">\n%prefix% &f以前の場所に戻るにはここをクリック\n</hover></click>"
cannot-spectate-return: "%prefix% &cプレイヤーを観戦した後でのみ使用できます"
cannot-run-on-self: "%prefix% &c自分自身にこのコマンドは使用できません！"
upload-log: "%prefix% &fデバッグをアップロードしました: %url%"
upload-log-start: "%prefix% &fログをアップロード中... しばらくお待ちください"
upload-log-not-found: "%prefix% &cそのログが見つかりません"
upload-log-upload-failure: "%prefix% &cログのアップロード中に問題が発生しました。詳細はコンソールを確認してください"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>パケットの処理中にエラーが発生しました。管理者に連絡してください。"
    blacklisted-forge: "<red>あなたのForgeバージョンはリーチハックが内蔵されているためブロックされています。<newline><gold>影響を受けるバージョン: 1.18.2-1.19.3<newline><newline><red>詳細は https://github.com/MinecraftForge/MinecraftForge/issues/9309 を参照してください。"
run-as-player: "%prefix% &cこのコマンドはプレイヤーのみが使用できます！"
run-as-player-or-console: "%prefix% &cこのコマンドはプレイヤーまたはコンソールからのみ使用できます！"
webhook-not-enabled: "DiscordのWebhookは有効になっていません！"
webhook-test-message: "テストメッセージ"
webhook-test-succeeded: "Discord Webhookのテストに成功しました！"
webhook-test-failed: "Discord Webhookのテストに失敗しました！"

# 使用可能なプレースホルダー:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - 違反回数
# %verbose% - チェックからの追加情報（全てのチェックが情報を追加するわけではありません）
alerts-format: "%prefix% &f%player% が &b%check_name%%experimental% &fに失敗しました (x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% が &b%check_name%%experimental% &fに失敗しました (x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &b%player% のプロファイル"
    - "&bPing: &f%ping%"
    - "&bバージョン: &f%version%"
    - "&bクライアントブランド: &f%brand%"
    - "&b水平感度: &f%h_sensitivity%%"
    - "&b垂直感度: &f%v_sensitivity%%"
    - "&bFastMath有効: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/grim alerts [player] &f- &7アラートの切替（プレイヤーでフィルタ可能）"
    - "/grim brands &f- &7ブランド表示の切替"
    - "/grim profile <player> &f- &7プレイヤー情報を表示"
    - "/grim help &f- &7このヘルプメッセージを表示"
    - "/grim debug start/stop <player> &f- &7予測デバッグの開始/停止"
    - "/grim debug filter add/remove/reset &f- &7デバッグフィルターの管理"
    - "/grim debug paste <player> &f- &7デバッグバッファをアップロード"
    - "/grim perf &f- &7開発者用 ms/予測"
    - "/grim reload &f- &7設定を再読み込み"
    - "/grim spectate <player> &f- &7プレイヤーを観戦"
    - "/grim verbose [player] &f- &7全フラグを表示（プレイヤーでフィルタ可能）"
    - "/grim log <id> &f- &7フラグのデバッグログをアップロード"
    - "/grim log last [count] &f- &7最新N件のフラグをアップロード"
    - "/grim log range <from>-<to> &f- &7指定範囲のフラグをアップロード"
    - "/grim logger &f- &7パケットロガー（サブコマンドは /grim logger を参照）"
    - "/grim history <player> [page] &f- &7プレイヤーの過去のアラートを表示"
    - "&7======================"

grim-history-load-failure: "%prefix% &c履歴サブシステムの読み込みに失敗しました！サーバーコンソールでエラーを確認してください。"
grim-history-disabled: "%prefix% &c履歴サブシステムは無効です！"
# 有効なプレースホルダー: %prefix% %player% %page% %maxPages%
grim-history-header: "%prefix% &b%player% のログを表示中 (&f%page%&b/&f%maxPages%&f)"
# 有効なプレースホルダー: %prefix% %grim_version% %client_brand% %client_version% %server_version% %check% %vl% %verbose% %timeago% %server%
grim-history-entry: "%prefix% &8[&f%server%&8] &b失敗 &f%check% (x&c%vl%&f) &7%verbose% (&b%timeago% 前&7)"
