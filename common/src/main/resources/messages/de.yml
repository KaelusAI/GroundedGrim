# \u00BB ist » (doppeltes >>), ANSI und UTF-8 interpretieren dies unterschiedlich... möglicherweise siehst du sogar "?" deshalb.
prefix: "&bGroundedGrim &8\u00BB"

alerts-enabled: "%prefix% &fBenachrichtigungen aktiviert"
alerts-disabled: "%prefix% &fBenachrichtigungen deaktiviert"
verbose-enabled: "%prefix% &fVerbose aktiviert"
verbose-disabled: "%prefix% &fVerbose deaktiviert"
alerts-filter: "%prefix% &fBenachrichtigungen gefiltert für: &b%player%"
verbose-filter: "%prefix% &fVerbose gefiltert für: &b%player%"
brands-enabled: "%prefix% &fMarken aktiviert"
brands-disabled: "%prefix% &fMarken deaktiviert"
client-brand-format: "%prefix% &f%player% hat sich mit %brand% verbunden"
console-specify-target: "%prefix% &cDu musst ein Ziel angeben, da du die Konsole benutzt!"
reloading: "%prefix% &7Konfiguration wird neu geladen..."
reloaded: "%prefix% &fDie Konfiguration wurde neu geladen."
reload-failed: "%prefix% &cFehler beim Neuladen der Konfiguration."
player-not-found: "%prefix% &cSpieler ist ausgenommen oder offline!"
player-not-this-server: "%prefix% &cSpieler ist nicht auf diesem Server!"
sender-not-found: "%prefix% &cDu kannst diesen Befehl nicht verwenden, wenn du ausgenommen bist!"
spectate-return: "<click:run_command:/grim stopspectating><hover:show_text:\"/grim stopspectating\">\n%prefix% &fKlicke hier, um zur vorherigen Position zurückzukehren\n</hover></click>"
cannot-spectate-return: "%prefix% &cDas kannst du nur tun, nachdem du einen Spieler beobachtet hast."
cannot-run-on-self: "%prefix% &cDu kannst diesen Befehl nicht auf dich selbst anwenden!"
upload-log: "%prefix% &fDebug wurde hochgeladen zu: %url%"
upload-log-start: "%prefix% &fLog wird hochgeladen... Bitte warten"
upload-log-not-found: "%prefix% &cLog konnte nicht gefunden werden"
upload-log-upload-failure: "%prefix% &cFehler beim Hochladen des Logs, siehe Konsole für weitere Informationen"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>Beim Verarbeiten von Paketen ist ein Fehler aufgetreten. Bitte kontaktiere die Administratoren."
    blacklisted-forge: "<red>Deine Forge-Version ist aufgrund eingebauter Reach-Hacks gesperrt.<newline><gold>Betroffene Versionen: 1.18.2-1.19.3<newline><newline><red>Bitte siehe https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &cDiesen Befehl können nur Spieler verwenden!"
run-as-player-or-console: "%prefix% &cDiesen Befehl können nur Spieler oder die Konsole verwenden!"
webhook-not-enabled: "Discord-Webhooks sind nicht aktiviert!"
webhook-test-message: "Testnachricht"
webhook-test-succeeded: "Discord-Webhook-Test erfolgreich!"
webhook-test-failed: "Discord-Webhook-Test fehlgeschlagen!"

# Gültige Platzhalter:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - Verstöße
# %verbose% - zusätzliche Informationen von der Prüfung, nicht alle Prüfungen liefern zusätzliche Informationen
alerts-format: "%prefix% &f%player% &bbestand &f%check_name%%experimental% &bnicht &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &bbestand &f%check_name%%experimental% &bnicht &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &bProfil für &f%player%"
    - "&bPing: &f%ping%"
    - "&bVersion: &f%version%"
    - "&bClient-Marke: &f%brand%"
    - "&bHorizontale Sensitivität: &f%h_sensitivity%%"
    - "&bVertikale Sensitivität: &f%v_sensitivity%%"
    - "&bFastMath aktiviert: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/grim alerts [player] &f- &7Benachrichtigungen umschalten (optional nach Spieler filtern)"
    - "/grim brands &f- &7Marken umschalten"
    - "/grim profile <player> &f- &7Spielerinfo anzeigen"
    - "/grim help &f- &7Diese Hilfe anzeigen"
    - "/grim debug start/stop <player> &f- &7Vorhersage-Debug starten/stoppen"
    - "/grim debug filter add/remove/reset &f- &7Debug-Filter verwalten"
    - "/grim debug paste <player> &f- &7Debug-Puffer hochladen"
    - "/grim perf &f- &7Entwickler ms/Vorhersage"
    - "/grim reload &f- &7Konfiguration neu laden"
    - "/grim spectate <player> &f- &7Einen Spieler beobachten"
    - "/grim verbose [player] &f- &7Alle Flags anzeigen (optional nach Spieler filtern)"
    - "/grim log <id> &f- &7Debug-Log eines Flags hochladen"
    - "/grim log last [count] &f- &7Letzte N Flags hochladen"
    - "/grim log range <from>-<to> &f- &7Einen Bereich von Flags hochladen"
    - "/grim logger &f- &7Paket-Logger (siehe /grim logger für Unterbefehle)"
    - "/grim history <player> [page] &f- &7Vorherige Benachrichtigungen des Spielers anzeigen"
    - "&7======================"

grim-history-load-failure: "%prefix% &cDas Verlaufs-Subsystem konnte nicht geladen werden! Überprüfe die Serverkonsole auf Fehler."
grim-history-disabled: "%prefix% &cDas Verlaufs-Subsystem ist deaktiviert!"
# Gültige Platzhalter: %prefix% %player% %page% %maxPages%
grim-history-header: "%prefix% &bZeige Logs für &f%player% (&f%page%&b/&f%maxPages%&f)"
# Gültige Platzhalter: %prefix% %grim_version% %client_brand% %client_version% %server_version% %check% %vl% %verbose% %timeago% %server%
grim-history-entry: "%prefix% &8[&f%server%&8] &bFehlgeschlagen &f%check% (x&c%vl%&f) &7%verbose% (&bvor %timeago%&7)"
