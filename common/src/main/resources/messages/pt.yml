# \u00BB é » (>> duplo), ANSI e UTF-8 interpretam isso de forma diferente... você pode acabar vendo '?' por conta disso.
prefix: "&bGroundedGrim &8\u00BB"

alerts-enabled: "%prefix% &fAlertas habilitados"
alerts-disabled: "%prefix% &fAlertas desabilitados"
verbose-enabled: "%prefix% &fVerbose habilitado"
verbose-disabled: "%prefix% &fVerbose desabilitado"
alerts-filter: "%prefix% &fFiltrando alertas para: &b%player%"
verbose-filter: "%prefix% &fFiltrando verbose para: &b%player%"
brands-enabled: "%prefix% &fMarcas habilitadas"
brands-disabled: "%prefix% &fMarcas desabilitadas"
client-brand-format: "%prefix% &f%player% entrou usando %brand%"
console-specify-target: "%prefix% &cVocê deve especificar um alvo pelo console!"
reloading: "%prefix% &7Recarregando configuração..."
reloaded: "%prefix% &fA configuração foi recarregada."
reload-failed: "%prefix% &cFalha ao recarregar a configuração."
player-not-found: "%prefix% &cJogador está isento ou offline!"
player-not-this-server: "%prefix% &cO jogador não está neste servidor!"
sender-not-found: "%prefix% &cVocê não pode usar este comando se estiver isento!"
spectate-return: "<click:run_command:/grim stopspectating><hover:show_text:\"/grim stopspectating\">\n%prefix% &fClique aqui para retornar à localização anterior\n</hover></click>"
cannot-spectate-return: "%prefix% &cVocê só pode fazer isso após espectar um jogador"
cannot-run-on-self: "%prefix% &cVocê não pode usar esse comando em si mesmo!"
upload-log: "%prefix% &fDebug enviado para: %url%"
upload-log-start: "%prefix% &fEnviando log... por favor aguarde"
upload-log-not-found: "%prefix% &cNão foi possível encontrar esse log"
upload-log-upload-failure: "%prefix% &cAlgo deu errado ao enviar o log, veja o console para mais informações"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>Ocorreu um erro ao processar pacotes. Por favor, entre em contato com os administradores."
    blacklisted-forge: "<red>Sua versão do Forge está bloqueada devido a hacks de alcance integrados.<newline><gold>Versões afetadas: 1.18.2-1.19.3<newline><newline><red>Consulte https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &cEste comando só pode ser usado por jogadores!"
run-as-player-or-console: "%prefix% &cEste comando só pode ser usado por jogadores ou pelo console!"
webhook-not-enabled: "Os webhooks do Discord não estão habilitados!"
webhook-test-message: "mensagem de teste"
webhook-test-succeeded: "Teste do webhook do Discord bem-sucedido!"
webhook-test-failed: "Teste do webhook do Discord falhou!"

# Placeholders válidos:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - violações
# %verbose% - informação extra da verificação, nem todas as verificações adicionam informação
alerts-format: "%prefix% &f%player% &bfalhou em &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &bfalhou em &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &bPerfil de &f%player%"
    - "&bPing: &f%ping%"
    - "&bVersão: &f%version%"
    - "&bMarca do cliente: &f%brand%"
    - "&bSensibilidade horizontal: &f%h_sensitivity%%"
    - "&bSensibilidade vertical: &f%v_sensitivity%%"
    - "&bFastMath ativado: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/grim alerts [player] &f- &7Alternar alertas (filtrar por jogador opcionalmente)"
    - "/grim brands &f- &7Alternar marcas"
    - "/grim profile <player> &f- &7Ver informações do jogador"
    - "/grim help &f- &7Ver esta mensagem de ajuda"
    - "/grim debug start/stop <player> &f- &7Iniciar/parar debug de predição"
    - "/grim debug filter add/remove/reset &f- &7Gerenciar filtros de debug"
    - "/grim debug paste <player> &f- &7Enviar buffer de debug"
    - "/grim perf &f- &7Desenvolvedor ms/predição"
    - "/grim reload &f- &7Recarregar a configuração"
    - "/grim spectate <player> &f- &7Espectar um jogador"
    - "/grim verbose [player] &f- &7Mostrar cada flag (filtrar por jogador opcionalmente)"
    - "/grim log <id> &f- &7Enviar log de debug de um flag"
    - "/grim log last [count] &f- &7Enviar os últimos N flags"
    - "/grim log range <from>-<to> &f- &7Enviar um intervalo de flags"
    - "/grim logger &f- &7Logger de pacotes (veja /grim logger para subcomandos)"
    - "/grim history <player> [page] &f- &7Mostrar alertas anteriores do jogador"
    - "&7======================"

grim-history-load-failure: "%prefix% &cO subsistema de histórico falhou ao carregar! Verifique o console do servidor por erros."
grim-history-disabled: "%prefix% &cO subsistema de histórico está desativado!"
# Placeholders válidos: %prefix% %player% %page% %maxPages%
grim-history-header: "%prefix% &bMostrando logs de &f%player% (&f%page%&b/&f%maxPages%&f)"
# Placeholders válidos: %prefix% %grim_version% %client_brand% %client_version% %server_version% %check% %vl% %verbose% %timeago% %server%
grim-history-entry: "%prefix% &8[&f%server%&8] &bFalhou &f%check% (x&c%vl%&f) &7%verbose% (&bhá %timeago%&7)"
